<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <title>批量打开网页</title>
<meta name="description" content="批量打开网页工具，支持一次打开多个链接，提高搜索和资料访问效率。">
<link rel="canonical" href="https://thinking555.github.io/a.html">
</head>
<body>

<h2>一键打开多个网页（高级版）</h2>

<button onclick="openAll()">全部打开</button>

<script>
const sites = [
    "https://www.google.com",
    "https://www.youtube.com",
    "https://www.github.com",
    "https://twitter.com",
    "https://www.reddit.com"
];

function openAll() {
    sites.forEach(url => {
        window.open(url);
    });
}
</script>

</body>
</html>
