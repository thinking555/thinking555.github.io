<title>StarTab</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto;
}

body{
    background:#ffffff;
    color:#000000;
}

/* 顶部 */
.topbar{
    position:relative;
    height:90px;
    padding:25px 60px;
}

.logo{
    font-size:28px;
    font-weight:600;
}

/* 搜索 */
.search-wrap{
    position:absolute;
    left:50%;
    top:50%;
    transform:translate(-50%,-50%);
    width:520px;
}

.search-box{
    display:flex;
    background:#ebe9e9;
    border-radius:8px;
    overflow:hidden;
    border:1px solid #e8e6e6;
}

.search-box input{
    flex:1;
    padding:14px 16px;
    border:none;
    outline:none;
    font-size:15px;
    background:#ffffff;
    color:#fff;
}

.search-box button{
    width:60px;
    border:none;
    background:#ffffff;
    cursor:pointer;
    color:#fff;
}

/* ===== 固定 5 列 ===== */
.container{
    column-count:5;
    column-gap:10px;
    padding:20px 60px 60px 60px;
    display:grid;
    grid-template-columns:repeat(5,1fr);
}

.section{
    margin-bottom:10px;
    break-inside:avoid;
}

.section h3{
    font-size:14px;
    margin-bottom:14px;
    color:#888;
    font-weight:500;
    text-align:center;   /* 👈 居中 */
}

/* 链接（无背景） */
.link-item{
    display:flex;
    align-items:center;
    margin-bottom:10px;
    text-decoration:none;
    color:#000000;
    font-size:16px;
    transition:.2s;
    word-break: break-word;
    overflow-wrap: break-word;
}

.link-item:hover{
    color:rgb(0, 158, 32);
   
}

/* 网站图标 */
.link-item img{
    width:16px;
    height:16px;
    margin-right:8px;
    border-radius:3px;
     flex-shrink:0;   /* 防止图标被压缩 */
}

</style>
<link rel="stylesheet" href="search-style.css">
</head>
