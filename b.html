<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <title>一键打开多个网页</title>
<meta name="description" content="一键打开多个网页工具，用于批量访问链接和快速打开网页。">
<link rel="canonical" href="https://thinking555.github.io/b.html">
</head>
<body>

<h2>一键打开网页</h2>

<button onclick="openAll()">打开所有网站</button>

<script>
function openAll() {
    window.open("https://www.google.com");
    window.open("https://www.youtube.com");
    window.open("https://www.github.com");
    window.open("https://twitter.com");
}
</script>

</body>
</html>
