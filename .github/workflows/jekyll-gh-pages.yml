# Sample workflow for building and deploying a Jekyll site to GitHub Pages
name: Deploy Jekyll with GitHub Pages dependencies preinstalled

on:
  # Runs on pushes targeting the default branch
  push:
    branches: ["main"]

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment, skipping runs queued between the run in-progress and latest queued.
# However, do NOT cancel in-progress runs as we want to allow these production deployments to complete.
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  # Build job
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Generate blog article listings
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const path = require('node:path');

          const blogDir = path.join(process.cwd(), 'blog');
          const homepagePath = path.join(process.cwd(), 'index.html');
          const blogIndexPath = path.join(blogDir, 'index.html');
          const homepageStartMarker = '<!-- AUTO_ARTICLES_START -->';
          const homepageEndMarker = '<!-- AUTO_ARTICLES_END -->';
          const blogStartMarker = '<!-- AUTO_BLOG_POSTS_START -->';
          const blogEndMarker = '<!-- AUTO_BLOG_POSTS_END -->';

          function escapeHtml(value) {
            return value.replace(/[&<>"']/g, (char) => ({
              '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
            })[char]);
          }

          function decodeHtmlEntities(value) {
            return value.replace(/&(#x[0-9a-f]+|#\d+|amp|lt|gt|quot|apos|#39);/gi, (entity, code) => {
              if (code[0] === '#') {
                const isHex = code[1].toLowerCase() === 'x';
                const number = Number.parseInt(code.slice(isHex ? 2 : 1), isHex ? 16 : 10);
                return Number.isFinite(number) ? String.fromCodePoint(number) : entity;
              }
              return ({ amp: '&', lt: '<', gt: '>', quot: '"', apos: "'", '#39': "'" })[code.toLowerCase()] || entity;
            });
          }

          function articleTitle(filePath, fileName) {
            const html = fs.readFileSync(filePath, 'utf8');
            const match = html.match(/<title\b[^>]*>([\s\S]*?)<\/title\s*>/i);
            const title = match && decodeHtmlEntities(match[1].replace(/<[^>]*>/g, '').trim());
            return title || fileName.replace(/^\d{4}-\d{2}-\d{2}-/, '').replace(/\.html$/i, '');
          }

          function datePrefix(fileName) {
            const match = fileName.match(/^(\d{4})-(\d{2})-(\d{2})-.+\.html$/i);
            if (!match) return null;
            const year = Number(match[1]);
            const month = Number(match[2]);
            const day = Number(match[3]);
            const date = new Date(Date.UTC(year, month - 1, day));
            if (date.getUTCFullYear() !== year || date.getUTCMonth() !== month - 1 || date.getUTCDate() !== day) return null;
            return `${match[1]}-${match[2]}-${match[3]}`;
          }

          const files = fs.existsSync(blogDir)
            ? fs.readdirSync(blogDir, { withFileTypes: true })
                .filter((entry) => entry.isFile() && entry.name.toLowerCase().endsWith('.html') && entry.name.toLowerCase() !== 'index.html')
                .map((entry) => ({ name: entry.name, path: path.join(blogDir, entry.name), date: datePrefix(entry.name) }))
                .sort((a, b) => (b.date || '').localeCompare(a.date || '') || b.name.localeCompare(a.name))
            : [];

          const posts = files.map(({ name, path: filePath, date }) => {
            const title = escapeHtml(articleTitle(filePath, name));
            const encodedName = encodeURIComponent(name).replace(/[!'()*]/g, (char) => `%${char.charCodeAt(0).toString(16).toUpperCase()}`);
            return { title, date, url: `/blog/${encodedName}` };
          });

          const articlePosts = posts.map(({ title, date, url }) => {
            const dateLabel = date
              ? `<time class="post-date" datetime="${date}">${date}</time>`
              : '<span class="post-date">日期未知</span>';
            return `      <li class="post-item">\n        <a class="post-title" href="${url}">${title}</a>\n        ${dateLabel}\n      </li>`;
          }).join('\n');

          function injectGeneratedSection(filePath, startMarker, endMarker, content, indent) {
            const html = fs.readFileSync(filePath, 'utf8');
            const markerPattern = new RegExp(`${startMarker}([\\s\\S]*?)${endMarker}`);
            if (!markerPattern.test(html)) throw new Error(`Generated section markers are missing from ${filePath}`);
            const body = content ? `\n${content}\n${indent}` : `\n${indent}`;
            fs.writeFileSync(filePath, html.replace(markerPattern, `${startMarker}${body}${endMarker}`));
          }

          const homepageLinks = posts.map(({ title, url }) => {
            return `            <a class="link-item" href="${url}" target="_blank">\n                <img src="https://www.google.com/s2/favicons?sz=64&domain=thinking555.github.io" alt="">\n                ${title}\n            </a>`;
          }).join('\n\n');

          injectGeneratedSection(homepagePath, homepageStartMarker, homepageEndMarker, homepageLinks, '            ');
          injectGeneratedSection(blogIndexPath, blogStartMarker, blogEndMarker, articlePosts || '<li class="empty-state">暂无文章</li>', '      ');
          console.log(`Generated ${files.length} article listing(s) for the homepage and /blog`);
          NODE
      - name: Build with Jekyll
        uses: actions/jekyll-build-pages@v1
        with:
          source: ./
          destination: ./_site
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3

  # Deployment job
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
