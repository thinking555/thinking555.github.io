<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Xinshoucpu</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto;
}

body{
    background:#ffffff;
    color:#000000;
}

/* 搜索区域 */
.search-wrap{
    margin:60px auto;
    width:520px;
    text-align:center;
}

.search-box{
    display:flex;
    border-radius:25px;
    overflow:hidden;
    border:1px solid #ddd;
}

.search-box input{
    flex:1;
    padding:12px 16px;
    border:none;
    outline:none;
    font-size:15px;
}

.search-box button{
    width:60px;
    border:none;
    background:#4CAF50;
    cursor:pointer;
    color:#ffffff;
    font-size:18px;
}

.search-box button:hover{
    background:#43a047;
}

/* 按钮美化 */
.button-group{
    margin-top:15px;
    display:flex;
    flex-wrap:wrap;
    gap:10px;
    justify-content:center;
}

.button-group button{
    padding:8px 16px;
    border:none;
    border-radius:20px;
    background:#f5f5f5;
    cursor:pointer;
    transition:0.2s;
}

.button-group button:hover{
    background:#4CAF50;
    color:#fff;
}
</style>
<link rel="stylesheet" href="search-style.css">
</head>

<body>

<div class="search-wrap">

    <div class="search-box">
        <input type="text" id="q" placeholder="输入关键词">
        <button onclick="searchGoogle()">🔍</button>
    </div>

    <div class="button-group">
        <button onclick="articleSearch()">文章搜索</button>
        <button onclick="googleAdvanced()">谷歌高级</button>
        <button onclick="translate()">谷歌翻译</button>
        <button onclick="bookSearch()">书籍搜索</button>
        <button onclick="musicSearch()">音乐搜索</button>
    </div>

</div>

<script>
function getQ(){
    return encodeURIComponent(document.getElementById("q").value);
}

function searchGoogle(){
    window.open("https://www.google.com/search?q=" + getQ());
}

function articleSearch(){
    let q = getQ();
    window.open("https://search.save-web.org/search?q=" + q);
    window.open("https://www.feisoo.com/result/" + q);
}

function googleAdvanced(){
    let q = getQ();
    window.open("https://www.google.com/search?q=" + q + "+site:zhihu.com");
    window.open("https://www.google.com/search?q=" + q + "+site:github.com");
}

function translate(){
    let q = getQ();
    window.open("https://translate.google.com/?sl=auto&tl=zh-CN&text=" + q);
}

function bookSearch(){
    let q = getQ();
    window.open("https://zh.1lib.sk/s/" + q);
    window.open("https://zh.annas-archive.gl/search?q=" + q);
    window.open("https://scholar.google.com/scholar?q=" + q);
}

function musicSearch(){
    let q = getQ();
    window.open("https://open.spotify.com/search/" + q);
    window.open("https://www.gequbao.com/s/" + q);
    window.open("https://zvu4it.org/tracks/" + q);
}
</script>

</body>
</html>
