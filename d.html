<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<title>复制框</title>
<style>
    body {
        background: #0f1117;
        display: flex;
        justify-content: center;
        align-items: center;
        height: 100vh;
        font-family: monospace;
    }

    .copy-box {
        background: #1a1d24;
        border-radius: 10px;
        padding: 12px 16px;
        width: 320px;
        display: flex;
        align-items: center;
        justify-content: space-between;
        color: #cfd3dc;
        box-shadow: 0 0 0 1px rgba(255,255,255,0.05);
    }

    .text {
        letter-spacing: 1px;
        font-size: 16px;
    }

    .copy-btn {
        cursor: pointer;
        opacity: 0.7;
        transition: 0.2s;
    }

    .copy-btn:hover {
        opacity: 1;
    }

    .copy-btn svg {
        width: 18px;
        height: 18px;
        fill: #cfd3dc;
    }

    .copied {
        color: #4ade80;
    }
</style>
</head>
<body>

<div class="copy-box">
    <div class="text" id="text">bP6DSrQbTP</div>
    
    <div class="copy-btn" onclick="copyText()">
        <!-- 复制图标 -->
        <svg viewBox="0 0 24 24">
            <path d="M16 1H4C2.9 1 2 1.9 2 3V15H4V3H16V1ZM19 5H8C6.9 5 6 5.9 6 7V21C6 22.1 6.9 23 8 23H19C20.1 23 21 22.1 21 21V7C21 5.9 20.1 5 19 5ZM19 21H8V7H19V21Z"/>
        </svg>
    </div>
</div>

<script>
function copyText() {
    const text = document.getElementById("text").innerText;
    navigator.clipboard.writeText(text);

    const el = document.getElementById("text");
    el.classList.add("copied");
    el.innerText = "已复制!";

    setTimeout(() => {
        el.innerText = text;
        el.classList.remove("copied");
    }, 1200);
}
</script>

</body>
</html>
