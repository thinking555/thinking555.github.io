<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>饮料含糖量可视化系统</title>
  <link rel="stylesheet" href="./css/style.css" />
</head>
<body>
  <main class="page">
    <header class="page-header">
      <div class="badge">🥤 </div>
      <h1>饮料含糖量可视化系统</h1>
      <p>
        方糖按 1 块 = 5g 计算&nbsp;&nbsp;&nbsp;每日摄入 <  25g 
      </p>

      <p>
        已添加数据已经过核对，99%为准确的。含糖量是通过碳水化合物比例计算得出的，标出糖的比例就按糖比例计算。
      </p>
    </header>
    <section class="filter-section">
  <input
    id="searchInput"
    class="search-input"
    type="search"
    placeholder="搜索饮料，如 康师傅、冰红茶、可乐、元气森林"
  />

  <select id="brandFilter" class="filter-select">
    <option value="all">全部品牌</option>
  </select>

  <select id="categoryFilter" class="filter-select">
    <option value="all">全部分类</option>
  </select>

  <select id="sugarFilter" class="filter-select">
    <option value="all">全部糖分</option>
    <option value="zero">无糖：0g</option>
    <option value="low">低糖：0～5g</option>
    <option value="middle">中糖：5～25g</option>
    <option value="high">高糖：25g以上</option>
  </select>
</section>
    <section id="cardGrid" class="card-grid" aria-label="饮料含糖量卡片列表"></section>

    <button id="loadMoreBtn" class="load-more-btn">加载更多</button>
    
    <section class="tips">
      <h2>添加内容？</h2>
      <p> drink@moemail.app 用随意邮箱发到我前面邮箱地址 </p>
      <pre><code>{
支持拍照添加饮料，把购买的饮料包装拍摄（正面、营养成分表）2张图片。格式（下方）
饮料名字：某某某
容量规格：多少 mL
[ 2张还算清晰的图片文件 ]
署名：XXX拍摄 （可留空）
}</code></pre>
    </section>
    
    <section class="share-section">
  <button id="shareBtn" class="share-btn">分享网站</button>
  <p id="shareTip" class="share-tip"></p>
</section>
    
  </main>

  <script src="./js/main.js"></script>
</body>
</html>
