<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>WPA*01 hc22000 本地生成器</title>
<style>
  body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;max-width:760px;margin:40px auto;padding:0 16px;line-height:1.5}
  h1{font-size:24px}
  label{display:block;margin-top:14px;font-weight:600}
  input,textarea,button{font:inherit}
  input,textarea{width:100%;box-sizing:border-box;padding:10px;border:1px solid #bbb;border-radius:8px}
  textarea{height:120px;margin-top:14px;font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
  button{margin-top:14px;padding:10px 16px;border:1px solid #999;border-radius:8px;cursor:pointer}
  .row{display:flex;gap:10px;flex-wrap:wrap}
  .note{margin-top:16px;font-size:14px}
  .ok{font-weight:600}
</style>
</head>
<body>
<h1>WPA*01 hc22000 本地生成器</h1>

<p>仅用于你自己的测试网络、实验环境或已获授权的安全测试。所有计算均在浏览器本地完成，不上传任何数据。</p>

<label>SSID</label>
<input id="ssid" value="TestWiFi">

<label>密码（8–63 个字符）</label>
<input id="password" value="12345678">

<label>AP MAC</label>
<input id="apmac" value="00:11:22:33:44:55">

<label>Client MAC</label>
<input id="climac" value="66:77:88:99:aa:bb">

<div class="row">
  <button id="generate">生成 hc22000</button>
  <button id="download" disabled>下载 test.hc22000</button>
</div>

<textarea id="output" readonly placeholder="生成结果会显示在这里"></textarea>

<div class="note">
  输出格式：<code>WPA*01*PMKID*AP_MAC*CLIENT_MAC*ESSID_HEX***</code>
</div>

<script>
const enc = new TextEncoder();

function normalizeMac(mac) {
  const s = mac.replace(/[^0-9a-fA-F]/g, "").toLowerCase();
  if (!/^[0-9a-f]{12}$/.test(s)) throw new Error("MAC 地址格式错误，应为 12 个十六进制字符");
  return s;
}

function hexToBytes(hex) {
  const out = new Uint8Array(hex.length / 2);
  for (let i = 0; i < out.length; i++) out[i] = parseInt(hex.substr(i * 2, 2), 16);
  return out;
}

function bytesToHex(bytes) {
  return [...new Uint8Array(bytes)].map(b => b.toString(16).padStart(2, "0")).join("");
}

async function pbkdf2Sha1(password, ssid) {
  const keyMaterial = await crypto.subtle.importKey(
    "raw",
    enc.encode(password),
    { name: "PBKDF2" },
    false,
    ["deriveBits"]
  );
  const bits = await crypto.subtle.deriveBits(
    {
      name: "PBKDF2",
      salt: enc.encode(ssid),
      iterations: 4096,
      hash: "SHA-1"
    },
    keyMaterial,
    256
  );
  return new Uint8Array(bits);
}

async function hmacSha1(keyBytes, dataBytes) {
  const key = await crypto.subtle.importKey(
    "raw",
    keyBytes,
    { name: "HMAC", hash: "SHA-1" },
    false,
    ["sign"]
  );
  const sig = await crypto.subtle.sign("HMAC", key, dataBytes);
  return new Uint8Array(sig);
}

let lastResult = "";

document.getElementById("generate").addEventListener("click", async () => {
  try {
    const ssid = document.getElementById("ssid").value;
    const password = document.getElementById("password").value;
    const apHex = normalizeMac(document.getElementById("apmac").value);
    const cliHex = normalizeMac(document.getElementById("climac").value);

    if (!ssid.length || ssid.length > 32) throw new Error("SSID 长度应为 1–32 个字符");
    if (password.length < 8 || password.length > 63) throw new Error("密码长度应为 8–63 个字符");

    const pmk = await pbkdf2Sha1(password, ssid);

    const prefix = enc.encode("PMK Name");
    const ap = hexToBytes(apHex);
    const cli = hexToBytes(cliHex);

    const data = new Uint8Array(prefix.length + ap.length + cli.length);
    data.set(prefix, 0);
    data.set(ap, prefix.length);
    data.set(cli, prefix.length + ap.length);

    const hmac = await hmacSha1(pmk, data);
    const pmkid = hmac.slice(0, 16);
    const essidHex = bytesToHex(enc.encode(ssid));

    lastResult = `WPA*01*${bytesToHex(pmkid)}*${apHex}*${cliHex}*${essidHex}***`;
    document.getElementById("output").value = lastResult;
    document.getElementById("download").disabled = false;
  } catch (e) {
    document.getElementById("output").value = "错误：" + e.message;
    document.getElementById("download").disabled = true;
  }
});

document.getElementById("download").addEventListener("click", () => {
  if (!lastResult) return;
  const blob = new Blob([lastResult + "\n"], { type: "text/plain;charset=utf-8" });
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url;
  a.download = "test.hc22000";
  document.body.appendChild(a);
  a.click();
  a.remove();
  URL.revokeObjectURL(url);
});
</script>
</body>
</html>
