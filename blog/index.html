<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Mgmg Blog 文章列表，按发布时间由新到旧排列。" />
  <link rel="canonical" href="https://thinking555.github.io/blog/" />
  <title>文章列表 | Mgmg Blog</title>
  <style>
    :root{
      --bg:#fafafa;
      --card:#ffffff;
      --text:#111111;
      --muted:#6b7280;
      --line:#e5e7eb;
      --soft:#f3f4f6;
      --accent:#111111;
    }
    @media (prefers-color-scheme: dark){
      :root{
        --bg:#0f1115;
        --card:#151922;
        --text:#f5f5f5;
        --muted:#9ca3af;
        --line:#2a3140;
        --soft:#1b2230;
        --accent:#ffffff;
      }
    }
    *{box-sizing:border-box}
    html{scroll-behavior:smooth}
    body{
      margin:0;
      font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;
      background:var(--bg);
      color:var(--text);
      line-height:1.75;
    }
    a{color:inherit;text-decoration:none}
    a:focus-visible{outline:2px solid var(--accent);outline-offset:4px;border-radius:3px}
    .topbar{border-bottom:1px solid var(--line);background:var(--bg)}
    .nav{
      max-width:980px;
      margin:0 auto;
      padding:18px 20px;
      display:flex;
      justify-content:space-between;
      align-items:center;
      gap:24px;
    }
    .brand{font-size:18px;font-weight:700;letter-spacing:.2px}
    .nav-links{display:flex;gap:22px;color:var(--muted);font-size:14px}
    .nav-links a:hover,.post-title:hover{color:var(--accent)}
    main{max-width:900px;margin:42px auto 64px;padding:0 20px}
    .page-heading{margin-bottom:24px}
    h1{margin:0 0 6px;font-size:32px;line-height:1.35}
    .page-heading p{margin:0;color:var(--muted);font-size:14px}
    .post-list{
      margin:0;
      padding:8px 26px;
      list-style:none;
      background:var(--card);
      border:1px solid var(--line);
      border-radius:16px;
    }
    .post-item{
      display:flex;
      align-items:baseline;
      justify-content:space-between;
      gap:24px;
      padding:16px 0;
      border-bottom:1px solid var(--line);
    }
    .post-item:last-child{border-bottom:none}
    .post-title{font-size:16px;font-weight:600;transition:color .15s ease}
    .post-date{flex-shrink:0;color:var(--muted);font-size:13px}
    .empty-state{padding:28px 0;text-align:center;color:var(--muted)}
    .footer{
      max-width:980px;
      margin:0 auto 40px;
      padding:0 20px;
      color:var(--muted);
      font-size:13px;
    }
    @media(max-width:600px){
      .nav-links{gap:14px}
      main{margin-top:30px}
      h1{font-size:28px}
      .post-list{padding:4px 18px}
      .post-item{align-items:flex-start;flex-direction:column;gap:4px}
    }
  </style>
</head>
<body>
  <header class="topbar">
    <div class="nav">
      <a class="brand" href="https://thinking555.github.io/">Mgmg Blog</a>
      <nav class="nav-links" aria-label="主导航">
        <a href="https://thinking555.github.io/">首页</a>
        <a href="https://thinking555.github.io/about">关于</a>
      </nav>
    </div>
  </header>

  <main>
    <div class="page-heading">
      <h1>文章</h1>
      <p>按发布时间由新到旧排列</p>
    </div>
    <ol class="post-list">
      <!-- AUTO_BLOG_POSTS_START -->
      <li class="empty-state">暂无文章</li>
      <!-- AUTO_BLOG_POSTS_END -->
    </ol>
  </main>

  <footer class="footer">
    © 2026 Mgmg Blog
  </footer>
</body>
</html>
